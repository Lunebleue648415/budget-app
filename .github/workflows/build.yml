# Construit Budget App pour les trois systèmes et publie les archives.
#
# POURQUOI EN INTÉGRATION CONTINUE PLUTÔT QU'À LA MAIN. PyInstaller ne sait pas
# compiler pour un autre système que celui sur lequel il tourne : il embarque
# l'interpréteur Python et les bibliothèques natives de la machine hôte. Un
# exécutable Linux ne peut donc être produit que sur Linux, un .app que sur
# macOS. Sans machine de chaque système sous la main, la CI EST la seule façon
# de produire les trois — d'où ce fichier.
#
# Déclenchement :
#   - `git tag v1.0.0 && git push --tags` -> construit les trois et crée une
#     Release GitHub avec les trois archives attachées ;
#   - manuellement (onglet Actions > Run workflow) -> construit les trois et
#     laisse les archives en artefacts, sans créer de Release.
name: Construire les applications

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # nécessaire pour créer la Release et y attacher les archives

jobs:
  # LA SUITE DE TESTS, SUR LES TROIS SYSTÈMES, AVANT TOUT LE RESTE.
  #
  # POURQUOI ELLE MANQUAIT ET POURQUOI C'EST UN PROBLÈME. Ce workflow ne
  # vérifiait jusqu'ici que l'EMPAQUETAGE : PyInstaller passe, le bundle
  # contient env.py et index.html. Un bundle peut se former parfaitement autour
  # d'un calcul faux — une Release verte ne disait donc rien de ce que
  # l'application calcule.
  #
  # POURQUOI SUR LES TROIS ET PAS SEULEMENT SUR UN. La suite ne tourne en
  # développement que sur Windows. Or trois choses ne s'y comportent pas comme
  # ailleurs : la CASSE des noms de fichiers (Windows l'ignore, Linux non — un
  # fichier référencé sous une autre casse marche ici et échoue là-bas), la
  # résolution des chemins, et le format des fins de ligne des relevés importés.
  #
  # AUCUNE DÉPENDANCE SYSTÈME, contrairement à la construction : les tests
  # n'ouvrent aucune fenêtre (pywebview n'est jamais importé) et travaillent sur
  # une base SQLite en mémoire. D'où l'absence du bloc apt-get de Linux.
  tests:
    name: Tests (${{ matrix.nom }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Un système qui échoue ne doit pas masquer l'état des deux autres :
      # savoir que macOS seul casse est une information, tout annuler n'en est
      # pas une.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
          - os: ubuntu-latest
            nom: Linux
          - os: macos-latest
            nom: macOS

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Depuis `backend/` : c'est la racine que conftest.py et les imports
      # `from app import ...` supposent.
      - name: Suite de tests
        working-directory: backend
        run: python -m pytest -q

  construire:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Un système qui échoue ne doit pas annuler les deux autres : mieux vaut
      # deux applications livrables et un échec à corriger que rien du tout.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Windows
            archive: budget-app-windows
          - os: ubuntu-latest
            nom: Linux
            archive: budget-app-linux
          # DEUX RUNNERS macOS, ET NON UN. PyInstaller ne compile que pour
          # l'architecture de la machine qui l'exécute : `macos-latest` désigne
          # un runner Apple Silicon depuis le retrait des images Intel, et ne
          # produisait donc qu'une application arm64. Un Mac Intel ne peut RIEN
          # en faire — Rosetta traduit Intel vers ARM, jamais l'inverse.
          #
          # POURQUOI PAS UN SEUL BINAIRE `universal2`, qui éviterait à
          # l'utilisateur d'avoir à choisir : PyInstaller exige que CHAQUE
          # extension binaire embarquée le soit aussi, or `pydantic-core` ne
          # publie que deux roues séparées (macosx_11_0_arm64 et
          # macosx_10_12_x86_64) et aucune universal2. Il faudrait la
          # recompiler soi-même en Rust pour les deux cibles ; deux archives
          # coûtent une ligne dans le tableau des notes de version.
          #
          # `macos-15-intel` et non `macos-13`, retiré le 4 décembre 2025.
          # C'est la DERNIÈRE image x86_64 d'Actions, disponible jusqu'en août
          # 2027 — à peu près le moment où les Mac Intel sortiront du support
          # de macOS (Tahoe est la dernière version à les accepter). Cette
          # entrée est donc faite pour être retirée, pas pour durer.
          #
          # Rien d'autre à changer dans ce job : tous les pas qui distinguent
          # macOS testent `runner.os == 'macOS'`, vrai sur les deux runners.
          - os: macos-latest
            nom: macOS (Apple Silicon)
            archive: budget-app-macos-arm64
          - os: macos-15-intel
            nom: macOS (Intel)
            archive: budget-app-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Même version que l'environnement de développement : PyInstaller
          # embarque l'interpréteur, une version différente changerait ce qui
          # est livré à l'utilisateur.
          python-version: "3.14"

      # pywebview a besoin d'un moteur de rendu, fourni par le système sur
      # Windows (WebView2) et macOS (WebKit) mais pas sur Linux : GTK et
      # WebKit2GTK doivent y être installés explicitement. C'est la seule
      # dépendance système du projet, et la raison pour laquelle le README
      # Linux demande à l'utilisateur de l'installer aussi.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 \
            libcairo2-dev python3-gi python3-gi-cairo

      # VERSIONS ÉPINGLÉES, ET C'EST DÉLIBÉRÉ. PyInstaller ne fait pas que
      # compiler : c'est lui (via pyinstaller-hooks-contrib) qui décide QUELLES
      # DLL natives embarquer pour pythonnet/clr_loader, la pile qui ouvre la
      # fenêtre sur Windows. Un simple `pip install pyinstaller pywebview`
      # installe la dernière version disponible AU MOMENT DU BUILD — deux
      # Releases construites à quelques semaines d'écart peuvent embarquer des
      # hooks différents, sans qu'aucun commit ne l'explique. C'est exactement
      # ce qui s'est produit le 9 septembre 2026 (v1.0.2) : le bundle Windows
      # buildé en CI avec pyinstaller-hooks-contrib 2026.7 échouait au
      # démarrage (« Failed to resolve Python.Runtime.Loader.Initialize »,
      # cf. clr_loader/netfx.py), alors que le même code, construit en local
      # avec pyinstaller 6.21.0 + hooks-contrib 2026.6, démarrait sans erreur.
      #
      # Ces numéros sont donc la référence CONNUE POUR MARCHER, vérifiée sur ce
      # projet. Les remonter est un choix délibéré, pas un oubli — à faire un à
      # la fois, en reconstruisant et en testant le lancement réel de la
      # fenêtre (pas seulement que PyInstaller termine sans erreur) avant de
      # committer la remontée.
      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller==6.21.0 pyinstaller-hooks-contrib==2026.6 pywebview==6.2.1 pythonnet==3.1.0 clr_loader==0.3.1

      # Les trois formats sont produits depuis n'importe quel système (encodeurs
      # écrits en bibliothèque standard) : chaque runner régénère le sien plutôt
      # que de dépendre d'un binaire commité.
      - name: Générer les icônes
        run: python desktop/generer_icone.py

      # UNE SEULE COMMANDE POUR LES TROIS SYSTÈMES : c'est la spec qui lit la
      # plateforme courante et en tire icône, options et bundle
      # (cf. desktop/platforms/). Rien à brancher ici.
      - name: Construire
        run: python -m PyInstaller desktop/budget_app.spec --noconfirm --distpath desktop/dist --workpath desktop/build

      # Vérification minimale mais réelle : le bundle contient-il ce sans quoi
      # l'application ne démarre pas ? Une construction « réussie » à laquelle
      # il manque les migrations produit un exécutable qui plante au premier
      # lancement, chez l'utilisateur et pas ici.
      - name: Vérifier le bundle
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "macOS" ]; then
            racine="desktop/dist/Budget App.app"
          else
            racine="desktop/dist/Budget App"
          fi
          # `find` plutôt qu'un chemin exact : PyInstaller range les données
          # sous _internal/ (Windows, Linux) mais sous Contents/Frameworks ou
          # Contents/Resources selon sa version pour un bundle .app, avec des
          # liens symboliques entre les deux. Ce qui compte est que le fichier
          # soit là, pas l'endroit exact où cette version l'a mis.
          for requis in "env.py" "index.html"; do
            if [ -z "$(find "$racine" -name "$requis" -print -quit)" ]; then
              echo "Bundle incomplet : $requis introuvable sous $racine" >&2
              exit 1
            fi
          done
          echo "Bundle complet."

      # LE DOSSIER `extensions/` EST LIVRÉ, VIDE MAIS PRÉSENT. L'application le
      # crée toute seule au premier lancement (cf. app/extensions.py::
      # preparer_dossiers), ce qui suffit à la faire fonctionner — mais pas à
      # rendre l'installation compréhensible : on télécharge une extension, on
      # ouvre l'archive de l'application, et le dossier où la déposer n'y est
      # pas. Il fallait avoir lancé l'app une fois pour le voir apparaître, ce
      # que rien n'indiquait.
      #
      # Un dossier VIDE ne peut pas voyager dans un zip : d'où le fichier
      # d'explication, qui sert donc deux fois — il porte le dossier, et il dit
      # quoi y mettre. Son texte vit dans le dépôt (desktop/) plutôt qu'ici :
      # il se relit et se corrige comme n'importe quel fichier, sans passer par
      # les règles de citation d'un script shell dans du YAML.
      - name: Préparer le dossier des extensions
        shell: bash
        run: |
          set -eu
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Sur macOS, l'application cherche ses extensions à côté de son
            # EXÉCUTABLE, donc dans Contents/MacOS — là où vit aussi sa base de
            # données (cf. app/extensions.py::_racine_projet).
            cible="desktop/dist/Budget App.app/Contents/MacOS/extensions"
          else
            cible="desktop/dist/Budget App/extensions"
          fi
          mkdir -p "$cible"
          cp desktop/extensions-LISEZMOI.txt "$cible/LISEZMOI.txt"
          echo "Dossier des extensions prêt : $cible"

      - name: Archiver
        shell: bash
        run: |
          cd desktop/dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../../${{ matrix.archive }}.zip" "Budget App"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # -y : préserve les liens symboliques, dont un bundle .app est
            # rempli (frameworks). Les suivre produirait une archive énorme
            # et une application que macOS refuse d'ouvrir.
            zip -ry "../../${{ matrix.archive }}.zip" "Budget App.app"
          else
            zip -ry "../../${{ matrix.archive }}.zip" "Budget App"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}.zip

  # Les extensions sont publiées SÉPARÉMENT des applications, parce qu'elles ne
  # sont plus embarquées dedans : l'utilisateur télécharge celles qu'il veut et
  # les dépose dans le dossier `extensions/` créé à côté de l'exécutable.
  #
  # Une archive PAR extension, et non une archive commune : personne ne devrait
  # avoir à prendre les cinq pour en installer une. Chaque archive contient le
  # dossier de l'extension, prêt à être déposé tel quel.
  #
  # Un seul runner suffit : une extension est du code Python et JavaScript, sans
  # rien de compilé — la même archive fonctionne sur les trois systèmes.
  extensions:
    name: Empaqueter les extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archiver chaque extension
        run: |
          set -eu
          mkdir -p archives-extensions
          # `extensions-dev/` n'est pas dans le dépôt (cf. .gitignore) : rien à
          # exclure ici, il n'y a simplement rien à trouver.
          for dossier in extensions/*/; do
            [ -f "$dossier/extension.json" ] || continue
            nom=$(basename "$dossier")
            # Les caches Python d'un éventuel test local n'ont rien à faire
            # dans une archive distribuée.
            (cd extensions && zip -r "../archives-extensions/extension-$nom.zip" "$nom" \
              -x '*__pycache__*' '*.pyc')
            echo "Archivée : extension-$nom.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: archives-extensions/*.zip

  publier:
    name: Publier la Release
    # `tests` en plus des deux autres : rien ne se publie sur une suite rouge.
    # La construction, elle, tourne EN PARALLÈLE des tests plutôt qu'après —
    # un échec de test ne doit pas priver du diagnostic de l'empaquetage.
    needs: [tests, construire, extensions]
    runs-on: ubuntu-latest
    # Seulement sur un tag : un lancement manuel sert à vérifier que la
    # construction passe, pas à publier une version.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: archives/*.zip
          generate_release_notes: true
          body: |
            ## Installation

            Télécharge l'archive de ton système, décompresse-la où tu veux
            (un dossier où tu peux écrire — pas « Program Files »), et lance
            **Budget App**.

            | Système | Archive | À savoir |
            |---|---|---|
            | Windows | `budget-app-windows.zip` | Rien à installer |
            | macOS — puce Apple | `budget-app-macos-arm64.zip` | Mac M1 ou plus récent. Voir « Ouvrir l'app » ci-dessous |
            | macOS — Intel | `budget-app-macos-x64.zip` | Mac à processeur Intel. Voir « Ouvrir l'app » ci-dessous |
            | Linux | `budget-app-linux.zip` | Nécessite WebKit2GTK (voir le README) |

            **Quelle archive macOS ?** Menu  > *À propos de ce Mac*. Si la
            ligne dit « Puce Apple M… », prends `arm64` ; si elle dit
            « Processeur Intel », prends `x64`. Se tromper donne une
            application que macOS refuse d'ouvrir.

            ### Ouvrir l'app sous macOS

            Elle n'est pas signée par un certificat Apple : macOS refuse le
            premier lancement. **Depuis macOS 15 (Sequoia), le clic droit >
            Ouvrir ne suffit plus** — Apple a retiré ce contournement.

            Double-clique l'app (le refus est attendu), puis va dans
            **Réglages Système > Confidentialité et sécurité**, descends
            jusqu'à la section *Sécurité*, et clique **« Ouvrir quand même »**.
            Une seule fois : les lancements suivants sont normaux.

            Sur macOS 14 et antérieur, le **clic droit > Ouvrir** d'avant
            fonctionne toujours.

            L'application fonctionne **hors ligne** : aucune donnée ne quitte
            ta machine. Seule exception, à installer soi-même : l'extension
            « Lecture de cours », qui va lire un cours de bourse ou un taux de
            change sur la page dont tu colles le lien.

            ## Extensions (facultatif)

            L'application est livrée **sans aucune extension** : le dossier
            `extensions/` arrive vide, à côté de l'exécutable.

            Pour en ajouter une, télécharge son archive `extension-*.zip`
            ci-dessous et **décompresse-la dans ce dossier `extensions/`**. Au
            prochain lancement, l'application te dira l'avoir trouvée et te
            proposera de l'allumer.

            ```
            Budget App/
              Budget App.exe
              data/
              extensions/
                placements/        <- le dossier décompressé
            ```

            Une extension trouvée arrive **éteinte** : rien d'elle n'est
            chargé tant que tu n'as pas coché sa case, au lancement ou dans
            **Paramètres → Extensions**. La décocher ne supprime aucune donnée.
